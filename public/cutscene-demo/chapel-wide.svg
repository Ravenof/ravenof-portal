<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b1626"/><stop offset="0.6" stop-color="#241a2e"/><stop offset="1" stop-color="#0d0a14"/>
    </linearGradient>
    <linearGradient id="moon" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#9fb4d8" stop-opacity="0.5"/><stop offset="1" stop-color="#9fb4d8" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="1920" height="1080" fill="url(#sky)"/>
  <!-- back wall + broken vault -->
  <path d="M0 1080 V300 L240 260 320 80 420 250 700 210 960 40 1220 210 1500 250 1600 90 1690 260 1920 300 V1080 Z" fill="#171221"/>
  <!-- lancet windows -->
  <g fill="#241c33">
