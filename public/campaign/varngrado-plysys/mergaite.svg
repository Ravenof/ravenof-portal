<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 900">
  <!-- PLACEHOLDER - Mergaite su mediniu varnu (pasikartojantis civilio motyvas) -->
  <g>
    <!-- galva -->
    <circle cx="250" cy="150" r="62" fill="#d9b48c"/>
    <path d="M188 140 q10 -70 62 -70 q52 0 62 70 l-8 44 q-54 -30 -108 0 Z" fill="#6a4a2c"/>
    <!-- kasos -->
    <path d="M196 178 q-14 60 -6 110" stroke="#6a4a2c" stroke-width="16" fill="none" stroke-linecap="round"/>
    <path d="M304 178 q14 60 6 110" stroke="#6a4a2c" stroke-width="16" fill="none" stroke-linecap="round"/>
    <!-- akys -->
    <circle cx="228" cy="152" r="7" fill="#2a2018"/>
    <circle cx="272" cy="152" r="7" fill="#2a2018"/>
    <path d="M236 182 q14 10 28 0" stroke="#a5764a" stroke-width="5" fill="none" stroke-linecap="round"/>
    <!-- suknelė / apsiaustas -->
    <path d="M250 212 L172 380 L160 780 L340 780 L328 380 Z" fill="#8a6a4f"/>
    <path d="M250 212 L200 360 L196 760 L304 760 L300 360 Z" fill="#a5825f"/>
    <!-- rankos laiko varną prie krūtinės -->
    <path d="M186 400 q40 60 64 66 M314 400 q-40 60 -64 66" stroke="#d9b48c" stroke-width="22" fill="none" stroke-linecap="round"/>
    <!-- medinis varnas su tvarsčio sparnu -->
    <g transform="translate(250 470)">
      <path d="M-46 0 q20 -34 46 -34 q34 0 44 26 q14 4 18 14 l-16 2 q-6 22 -46 22 q-36 0 -46 -30 Z" fill="#4a3622"/>
      <circle cx="26" cy="-16" r="4" fill="#f0e6d0"/>
      <!-- tvarsčio juostelė ant sparno -->
      <path d="M-30 -10 l26 18 M-24 -16 l26 18" stroke="#e8ddc4" stroke-width="7" stroke-linecap="round"/>
    </g>
    <!-- kojos -->
    <rect x="212" y="770" width="26" height="90" fill="#5d4632"/>
    <rect x="262" y="770" width="26" height="90" fill="#5d4632"/>
  </g>
  <text x="250" y="880" text-anchor="middle" font-family="monospace" font-size="26" fill="#4d4766">PLACEHOLDER mergaite</text>
</svg>
