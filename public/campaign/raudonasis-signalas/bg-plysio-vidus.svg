<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080">
  <defs>
    <linearGradient id="hell" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a0a12"/><stop offset="0.6" stop-color="#3a1014"/><stop offset="1" stop-color="#5a1a10"/>
    </linearGradient>
    <linearGradient id="lava" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7a2a10"/><stop offset="0.5" stop-color="#c85a1e"/><stop offset="1" stop-color="#7a2a10"/>
    </linearGradient>
  </defs>
  <rect width="1920" height="1080" fill="url(#hell)"/>
  <!-- plysio krastai (juodi) -->
  <path d="M0 0 H400 Q300 300 340 600 Q360 850 260 1080 H0 Z" fill="#07050d"/>
  <path d="M1920 0 H1520 Q1620 300 1580 600 Q1560 850 1660 1080 H1920 Z" fill="#07050d"/>
  <!-- judancios kolonos -->
  <g fill="#2a0d14">
    <rect x="560" y="120" width="90" height="960" transform="rotate(2 605 600)"/>
    <rect x="900" y="60" width="110" height="1020" transform="rotate(-1.5 955 570)"/>
    <rect x="1260" y="140" width="80" height="940" transform="rotate(3 1300 610)"/>
  </g>
  <!-- milziniskos grandines -->
  <g stroke="#1a0e14" stroke-width="16" fill="none" opacity="0.9">
    <path d="M480 0 Q560 300 500 620 Q470 840 560 1080"/>
    <path d="M1420 0 Q1340 260 1400 560 Q1440 820 1360 1080"/>
  </g>
  <g fill="none" stroke="#3a1a1a" stroke-width="6">
    <ellipse cx="520" cy="300" rx="26" ry="40"/><ellipse cx="510" cy="380" rx="26" ry="40"/>
    <ellipse cx="1392" cy="340" rx="26" ry="40"/><ellipse cx="1400" cy="420" rx="26" ry="40"/>
  </g>
  <!-- oranzines upes apacioje -->
  <path d="M340 980 Q700 930 1060 975 T1660 960 V1080 H260 Z" fill="url(#lava)" opacity="0.85"/>
  <path d="M400 1010 Q760 975 1120 1008 T1620 1000" stroke="#ffb27a" stroke-width="6" fill="none" opacity="0.6"/>
  <!-- krentantis raguotas siluetas -->
  <g transform="translate(1080 360) rotate(18)" fill="#0d0509">
    <ellipse cx="0" cy="0" rx="46" ry="70"/>
    <path d="M-30 -56 L-58 -110 L-20 -74 Z M30 -56 L58 -110 L20 -74 Z"/>
    <path d="M-40 40 L-90 90 L-30 70 Z M40 40 L90 90 L30 70 Z"/>
  </g>
  <text x="960" y="56" text-anchor="middle" font-family="monospace" font-size="30" fill="#7a4650" opacity="0.9">PLACEHOLDER - Plysio vidus: kolonos, grandines, upes (9 kadras)</text>
</svg>
