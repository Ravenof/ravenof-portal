  <ellipse cx="450" cy="500" rx="180" ry="60" fill="#c81e1e" opacity="0.18"/>
  <text x="450" y="680" text-anchor="middle" font-family="monospace" font-size="26" fill="#8b6a70" opacity="0.9">PLACEHOLDER: Demonas (keturkojis)</text>
