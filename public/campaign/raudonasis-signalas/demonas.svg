  <path d="M180 600 L140 700 L200 700 L230 610 Z M330 610 L310 700 L370 700 L385 615 Z M560 600 L560 700 L620 700 L610 600 Z M720 580 L760 700 L820 700 L780 570 Z" fill="#140a10"/>
