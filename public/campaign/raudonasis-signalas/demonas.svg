  <!-- kunas zemas, ant keturiu -->
  <path d="M120 560 Q160 420 320 380 Q470 340 620 390 Q760 430 800 540 L760 620 Q600 560 450 580 Q300 600 170 630 Z" fill="#140a10"/>
