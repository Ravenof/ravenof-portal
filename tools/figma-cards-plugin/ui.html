<style>
  body { font: 12px system-ui, sans-serif; margin: 12px; color: #222 }
  button { margin: 4px 4px 4px 0; padding: 6px 10px; cursor: pointer }
  pre { background: #f4f4f4; padding: 8px; height: 230px; overflow: auto; white-space: pre-wrap; font-size: 11px }
  #p { color: #555; margin: 6px 0 }
</style>
<b>Ravenof kortos: numeracija + eksportas</b>
<div>
  <button id="c">1. Patikrinti</button>
  <button id="r">2. Sunumeruoti</button>
  <button id="e">3. Eksportuoti PNG</button>
</div>
<div id="p"></div>
<pre id="o">Eksportui pirma paleisk: node tools/figma-card-sink.mjs</pre>
<script>
  const SINK = 'http://localhost:47821'
  const o = document.getElementById('o'), p = document.getElementById('p')
  const send = (type) => parent.postMessage({ pluginMessage: { type } }, '*')
  document.getElementById('c').onclick = () => { o.textContent = 'Tikrinama…'; send('check') }
  document.getElementById('r').onclick = () => { if (confirm('Pakeisti visų kortų numerius LT ir EN puslapiuose?')) { o.textContent = 'Numeruojama…'; send('renumber') } }
  document.getElementById('e').onclick = () => { o.textContent = 'Eksportuojama…'; send('export') }
  const ack = (ok) => parent.postMessage({ pluginMessage: { type: 'ack', ok } }, '*')
  onmessage = async (ev) => {
    const m = ev.data.pluginMessage; if (!m) return
    if (m.type === 'log') { o.textContent = m.text; p.textContent = '' }
    if (m.type === 'progress') p.textContent = m.text
    if (m.type === 'file') {
      try { const r = await fetch(SINK + '/file?path=' + encodeURIComponent(m.path), { method: 'POST', body: m.bytes }); ack(r.ok) } catch { ack(false) }
    }
    if (m.type === 'manifest') {
      try { const r = await fetch(SINK + '/manifest', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(m.manifest, null, 1) }); ack(r.ok) } catch { ack(false) }
    }
  }
</script>
